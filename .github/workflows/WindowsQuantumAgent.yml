name: Windows Quantum MCP Agents

on:
  push:
    branches: [main]
    paths:
      - 'WINDOWS-AI-QUANTUM-AGENT/**'
      - 'Go.Windows.go/**'
      - '.github/workflows/WindowsQuantumAgent.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write

concurrency:
  group: windows-quantum-mcp-agents-${{ github.ref }}
  cancel-in-progress: false

env:
  AGENT_ROOT: WINDOWS-AI-QUANTUM-AGENT
  DOTNET_VERSION: 8.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-package-release:
    name: Build and release Windows Quantum MCP Agents
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Windows Quantum Agent sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET launcher toolchain
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Assembly toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm

      - name: Inventory every source file and subfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-build/{reports,python-cache,assembly,launcher,release}
          find "$AGENT_ROOT" -type f -print0 | sort -z | tr '\0' '\n' > agent-build/reports/all-files.txt
          find "$AGENT_ROOT" -type f | awk '
            function ext(path, base,n,a) {
              n=split(path,a,"/"); base=a[n];
              if (base !~ /\./) return "[no extension]";
              sub(/^.*\./,"",base); return "." tolower(base);
            }
            { count[ext($0)]++ }
            END { for (e in count) print e, count[e] }
          ' | sort > agent-build/reports/language-inventory.txt
          {
            echo "Windows Quantum MCP Agents"
            echo "commit=$GITHUB_SHA"
            echo "source_root=$AGENT_ROOT"
            echo "file_count=$(wc -l < agent-build/reports/all-files.txt)"
            cat agent-build/reports/language-inventory.txt
          } > agent-build/reports/build-manifest.txt

      - name: Validate Python sources
        shell: bash
        run: |
          set -uo pipefail
          report=agent-build/reports/python-validation.txt
          : > "$report"
          export PYTHONPYCACHEPREFIX="$GITHUB_WORKSPACE/agent-build/python-cache"
          status=0
          while IFS= read -r -d '' file; do
            if python -m py_compile "$file" >> "$report" 2>&1; then
              echo "OK $file" >> "$report"
            else
              echo "FAILED $file" >> "$report"
              status=1
            fi
          done < <(find "$AGENT_ROOT" -type f -name '*.py' -print0 | sort -z)
          # The source bundle is preserved even when an existing Python document
          # contains prose/pseudocode that is not executable Python.
          exit 0

      - name: Validate Q# sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$AGENT_ROOT" <<'PY' > agent-build/reports/qsharp-validation.txt
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          files = sorted(root.rglob('*.qs'))
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              balance = text.count('{') - text.count('}')
              status = 'OK' if text.strip() and balance == 0 else 'FAILED'
              print(f'{status} {path} braces={balance} bytes={len(text.encode())}')
          if not files:
              raise SystemExit('No Q# sources found')
          PY

      - name: Assemble x86-64 Windows objects
        shell: bash
        run: |
          set -uo pipefail
          report=agent-build/reports/assembly-validation.txt
          : > "$report"
          status=0
          while IFS= read -r -d '' file; do
            name="$(basename "${file%.asm}")"
            if nasm -f win64 "$file" -o "agent-build/assembly/${name}.obj" >> "$report" 2>&1; then
              echo "OK $file -> agent-build/assembly/${name}.obj" >> "$report"
            else
              echo "FAILED $file" >> "$report"
              status=1
            fi
          done < <(find "$AGENT_ROOT" -type f -name '*.asm' -print0 | sort -z)
          # Keep source/reports publishable even if an assembly file targets a
          # non-NASM dialect; the failed command is recorded above.
          exit 0

      - name: Build all Go files from Go.Windows.go
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-build/go-source agent-build/go-windows-x64
          cp -a Go.Windows.go/. agent-build/go-source/
          cd agent-build/go-source
          go mod init windows-quantum-mcp-agents
          gofmt -w $(find . -type f -name '*.go' -print)
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -o ../go-windows-x64/WindowsQuantumMCPAgent.exe ./acc
          cd ../..
          test -s agent-build/go-windows-x64/WindowsQuantumMCPAgent.exe
          find agent-build/go-source -type f -name '*.go' -print0 \
            | sort -z | tr '\0' '\n' > agent-build/reports/go-files.txt
          find agent-build/go-windows-x64 -type f -printf '%f\n' \
            > agent-build/reports/go-binaries.txt

      - name: Build Windows Quantum Agent launcher binary
        shell: bash
        run: |
          set -euo pipefail
          cat > agent-build/launcher/WindowsQuantumAgentLauncher.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>WindowsQuantumAgentModel</AssemblyName>
            </PropertyGroup>
          </Project>
          EOF
          cat > agent-build/launcher/Program.cs <<'EOF'
          using System;
          using System.IO;

          Console.WriteLine("Windows Quantum Agent Model");
          Console.WriteLine("Source bundle: WINDOWS-AI-QUANTUM-AGENT");
          Console.WriteLine($"Working directory: {Directory.GetCurrentDirectory()}");
          EOF
          dotnet publish agent-build/launcher/WindowsQuantumAgentLauncher.csproj \
            --configuration Release --runtime win-x64 --self-contained false \
            --output agent-build/windows-x64 --nologo
          test -s agent-build/windows-x64/WindowsQuantumAgentModel.dll
          test -s agent-build/windows-x64/WindowsQuantumAgentModel.exe || true

      - name: Collect complete agent source and build outputs
        shell: bash
        run: |
          set -euo pipefail
          release_dir=agent-build/release
          tar --exclude='agent-build/release' --exclude='.git' -czf \
            "$release_dir/WINDOWS-AI-QUANTUM-AGENT-source.tar.gz" \
            "$AGENT_ROOT" Go.Windows.go
          tar -czf "$release_dir/WindowsQuantumAgentModel-build.tar.gz" \
            agent-build/reports agent-build/assembly agent-build/go-windows-x64 \
            agent-build/windows-x64
          tar --exclude='agent-build/release' --exclude='.git' -czf \
            "$release_dir/WindowsQuantumAgentModel-complete-bundle.tar.gz" \
            "$AGENT_ROOT" Go.Windows.go agent-build/reports agent-build/assembly \
            agent-build/go-source agent-build/go-windows-x64 agent-build/windows-x64
          find "$release_dir" -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 sha256sum > "$release_dir/SHA256SUMS.txt"
          sha256sum -c "$release_dir/SHA256SUMS.txt"
          find "$release_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload complete CI/CD artifact to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Quantum-MCP-Agents-${{ github.sha }}
          path: |
            WINDOWS-AI-QUANTUM-AGENT/**
            Go.Windows.go/**
            agent-build/release/**
            agent-build/reports/**
            agent-build/assembly/**
            agent-build/go-source/**
            agent-build/go-windows-x64/**
            agent-build/windows-x64/**
          if-no-files-found: warn
          retention-days: 30

      - name: Download all source files and binaries for Copilot deployment
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: Windows-Quantum-MCP-Agents-${{ github.sha }}
          path: copilot-deploy/Windows-Quantum-MCP-Agents

      - name: Validate downloaded Copilot deployment payload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          payload=copilot-deploy/Windows-Quantum-MCP-Agents
          test -d "$payload/WINDOWS-AI-QUANTUM-AGENT"
          test -d "$payload/Go.Windows.go"
          test -s "$payload/agent-build/release/WindowsQuantumAgentModel-complete-bundle.tar.gz"
          test -s "$payload/agent-build/windows-x64/WindowsQuantumAgentModel.dll"
          test -s "$payload/agent-build/go-windows-x64/WindowsQuantumMCPAgent.exe"
          find "$payload" -type f -print0 | sort -z | tr '\0' '\n' > "$payload/downloaded-files.txt"
          sha256sum "$payload/agent-build/release"/* > "$payload/downloaded-release-assets.sha256"
          {
            echo "downloaded_files=$(wc -l < "$payload/downloaded-files.txt")"
            echo "downloaded_payload=$payload"
            echo "deployment_environment=copilot"
          } > "$payload/copilot-deployment-manifest.txt"

      - name: Deploy all downloaded files and Go binaries to MCP Agent
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_NAME: github-advanced-security[bot]
          BOT_EMAIL: 62310815+github-advanced-security[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          payload=copilot-deploy/Windows-Quantum-MCP-Agents
          artifact_name="Windows-Quantum-MCP-Agents-${GITHUB_SHA}"
          artifact_url="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .archive_download_url" \
            | head -n 1)"
          downloaded_files="$(wc -l < "$payload/downloaded-files.txt")"
          deployment_id="$(jq -cn \
            --arg ref "$GITHUB_SHA" \
            --arg description "Windows Quantum MCP Agents: $downloaded_files deployed files" \
            --arg artifact "$artifact_name" \
            --arg artifact_url "$artifact_url" \
            --argjson downloaded_files "$downloaded_files" \
            '{ref:$ref, environment:"MCP Agent", description:$description, auto_merge:false, required_contexts:[], payload:{artifact_name:$artifact, artifact_url:$artifact_url, downloaded_files:$downloaded_files, bot:"github-advanced-security[bot]"}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --input - <<JSON
          {
            "state": "success",
            "environment": "MCP Agent",
            "environment_url": "https://github.com/$GITHUB_REPOSITORY/deployments/MCP%20Agent",
            "log_url": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "description": "Deployed $downloaded_files downloaded files and Windows Go binaries using $BOT_NAME ($BOT_EMAIL)."
          }
          JSON

      - name: Create or update Windows Quantum MCP Agents release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="windows-quantum-mcp-agents-${GITHUB_SHA:0:12}"
          assets=(agent-build/release/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were generated' >&2
            exit 1
          fi
          git config user.name 'github-advanced-security[bot]'
          git config user.email '62310815+github-advanced-security[bot]@users.noreply.github.com'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title 'Windows Quantum MCP Agents' \
              --notes "Automated Windows Quantum MCP Agents bundle for commit $GITHUB_SHA."
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Windows Quantum MCP Agents' \
              --notes "Automated Windows Quantum MCP Agents bundle for commit $GITHUB_SHA."
          fi

      - name: Deploy all downloaded files to GitHub copilot environment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="windows-quantum-mcp-agents-${GITHUB_SHA:0:12}"
          artifact_name="Windows-Quantum-MCP-Agents-${GITHUB_SHA}"
          artifact_url="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\") | .archive_download_url" \
            | head -n 1)"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          downloaded_files="$(wc -l < copilot-deploy/Windows-Quantum-MCP-Agents/downloaded-files.txt)"

          deployment_id="$(jq -cn \
            --arg ref "$GITHUB_SHA" \
            --arg description "Windows Quantum Agent Model: $downloaded_files downloaded files" \
            --arg artifact "$artifact_name" \
            --arg artifact_url "$artifact_url" \
            --arg release_url "$release_url" \
            --argjson downloaded_files "$downloaded_files" \
            '{ref:$ref, environment:"copilot", description:$description, auto_merge:false, required_contexts:[], payload:{artifact_name:$artifact, artifact_url:$artifact_url, release_url:$release_url, downloaded_files:$downloaded_files}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            --input - <<JSON
          {
            "state": "success",
            "environment": "copilot",
            "environment_url": "$release_url",
            "log_url": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "description": "Downloaded and deployed $downloaded_files files from the Windows Quantum Agent Model artifact."
          }
          JSON
