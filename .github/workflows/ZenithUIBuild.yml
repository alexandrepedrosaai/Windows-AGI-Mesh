name: CI-CD 03 ZenithUI Build Artifact Sign Publish

on:
  workflow_run:
    workflows: ["CI-CD 02 Build Test Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# The submitted Dockerfile is a runtime-only base image. This workflow exports
# the OCI image as a binary archive; it does not compile an application DLL.
env:
  IMAGE: ghcr.io/alexandrepedrosaai/zenithui
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-sign-publish:
    name: Build image artifact, hash, sign, and publish to GHCR
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name ==
      github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign the published image digest with GitHub OIDC
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Export the published image as a binary archive
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull "${IMAGE}:${IMAGE_TAG}"
          docker image inspect "${IMAGE}:${IMAGE_TAG}" >/dev/null
          docker save --output dist/zenithui-image.tar "${IMAGE}:${IMAGE_TAG}"
          printf '%s\n' "${IMAGE}@${DIGEST}" > dist/image-digest.txt
          cat > dist/image-metadata.json <<JSON
          {
            "image": "${IMAGE}",
            "tag": "${IMAGE_TAG}",
            "digest": "${DIGEST}",
            "artifact": "zenithui-image.tar"
          }
          JSON
          (cd dist && sha256sum zenithui-image.tar image-digest.txt image-metadata.json > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Sign SHA-256 manifest with Sigstore keyless signing
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Upload image, checksums, and signature bundle
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-image-${{ env.IMAGE_TAG }}
          path: |
            dist/zenithui-image.tar
            dist/image-digest.txt
            dist/image-metadata.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 3000
