name: ACC Constitutional State

on:

  push:
    branches:
      - main
    paths-ignore:
      - ACC_STATE.json

  workflow_dispatch:

permissions:
  contents: read

jobs:

  generate-state:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Test
        working-directory: Go.Windows.go
        run: |
          test -f go.mod || go mod init windows-agi-mesh/acc
          go mod tidy
          go test ./... -v

      - name: Build
        working-directory: Go.Windows.go
        run: |
          test -f go.mod || go mod init windows-agi-mesh/acc
          go build ./...

      - name: Generate ACC_STATE
        run: |

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > ACC_STATE.json << EOF
          {
            "constitution":"ACC-1.0",
            "timestamp":"${TS}",
            "commit":"${{ github.sha }}",
            "continuity":true,
            "governance":"PASS",
            "auditability":"PASS",
            "consensus":"PASS",
            "validation":"PASS",
            "status":"APPROVED"
          }
          EOF

      - name: Upload generated ACC state
        uses: actions/upload-artifact@v4
        with:
          name: ACC_STATE-${{ github.sha }}
          path: ACC_STATE.json
          if-no-files-found: error
          retention-days: 30
