# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow lets you compile your Go project using a SLSA3 compliant builder.
# This workflow will generate a so-called "provenance" file describing the steps
# that were performed to generate the final binary.
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA Go releaser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '**'
  release:
    types: [created]

permissions: read-all

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve or create tag for this commit
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.slice('refs/tags/'.length)
              : `build-${context.sha}`;

            if (!context.ref.startsWith('refs/tags/')) {
              let existing;

              try {
                existing = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: tag
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (existing) {
                if (existing.data.sha !== context.sha) {
                  throw new Error(
                    `Tag ${tag} points to a different commit.`
                  );
                }
              } else {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha
                });
              }
            }

            core.setOutput('tag', tag);

  build:
    needs: prepare
    permissions:
      id-token: write
      contents: write
      actions: read

    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0

    with:
      go-version: '1.25.0'
      config-file: .slsa-goreleaser.yml
      upload-assets: true
      upload-tag-name: ${{ needs.prepare.outputs.tag }}
      draft-release: 'false'
      prerelease: 'false'
