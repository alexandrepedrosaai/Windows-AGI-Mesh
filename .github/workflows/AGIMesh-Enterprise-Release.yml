name: AGIMesh Enterprise Release

on:
  push:
    branches:
      - main
      - release/*

  pull_request:
    branches:
      - main
      - release/*

  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:

  build-test:

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AGIMesh/AGIMesh.csproj

      - name: Build
        run: |
          dotnet build \
            AGIMesh/AGIMesh.csproj \
            -c Release \
            --no-restore

      - name: Test
        run: |
          dotnet test \
            AGIMesh/AGIMesh.csproj \
            -c Release
