name: AzureQuantumSDK Per-File Matrix Release

on:
  push:
    branches: [main]
    paths:
      - 'Azure/AzureQuantum/AzureQuantumSDK/src/**'
      - '.github/workflows/AzureQuantumSDK-Per-File.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  SDK_ROOT: Azure/AzureQuantum/AzureQuantumSDK
  PACKAGE_NAME: '@alexandrepedrosaai/azurequantumsdk'
  NPM_REGISTRY: https://npm.pkg.github.com
  ARTIFACT_ROOT: artifacts/azurequantumsdk-per-file

jobs:
  discover:
    name: Discover AzureQuantumSDK source files
    runs-on: ubuntu-latest
    outputs:
      shard0: ${{ steps.shards.outputs.shard0 }}
      shard1: ${{ steps.shards.outputs.shard1 }}
      shard2: ${{ steps.shards.outputs.shard2 }}
      shard3: ${{ steps.shards.outputs.shard3 }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: shards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          files = sorted(p.as_posix() for p in Path('Azure/AzureQuantum/AzureQuantumSDK/src').rglob('*') if p.is_file())
          shards = [files[i:i+256] for i in range(0, len(files), 256)]
          while len(shards) < 4: shards.append([])
          if len(shards) > 4: raise SystemExit(f'{len(files)} files require more than four 256-job shards')
          for i, shard in enumerate(shards): print(f'shard{i}={json.dumps(shard, separators=(",", ":"))}')
          print(f'total={len(files)}')
          PY

  shard0:
    name: Build and upload source file (${{ matrix.file }})
    needs: discover
    if: ${{ needs.discover.outputs.total != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.shard0) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js and GitHub Packages auth
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@alexandrepedrosaai'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest AzureQuantumSDK npm package before build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/latest-sdk" "$RUNNER_TEMP/sdk-install"
          npm pack "$PACKAGE_NAME@latest" --registry="$NPM_REGISTRY" --pack-destination "$RUNNER_TEMP/latest-sdk"
          package_file=$(find "$RUNNER_TEMP/latest-sdk" -type f -name '*.tgz' -print -quit)
          test -n "$package_file"
          npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/sdk-install" "$package_file"
          SDK_PACKAGE_ROOT="$RUNNER_TEMP/sdk-install/node_modules/@alexandrepedrosaai/azurequantumsdk"
          test -d "$SDK_PACKAGE_ROOT"
          node - <<'NODE'
          const sdk = require(process.env.RUNNER_TEMP + '/sdk-install/node_modules/@alexandrepedrosaai/azurequantumsdk');
          const c = sdk.createClient();
          if (!c.manifest().length || !/^[a-f0-9]{64}$/.test(c.digest())) process.exit(1);
          console.log(JSON.stringify({latestPackageFiles: c.manifest().length, latestPackageDigest: c.digest()}));
          NODE

      - name: Build and validate selected source file
        shell: bash
        env:
          SOURCE_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          test -s "$SOURCE_FILE"
          case "$SOURCE_FILE" in
            *.py) python3 -m py_compile "$SOURCE_FILE"; rm -rf "$(dirname "$SOURCE_FILE")/__pycache__" ;;
            *.json) jq empty "$SOURCE_FILE" ;;
            *.js|*.mjs|*.cjs) node --check "$SOURCE_FILE" ;;
            *.qs) grep -Eq '\b(namespace|operation|function|newtype)\b' "$SOURCE_FILE" ;;
            *) test -s "$SOURCE_FILE" ;;
          esac

      - name: Package selected file and write SHA-256 digest
        shell: bash
        env:
          SOURCE_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          safe=$(printf '%s' "$SOURCE_FILE" | tr '/ ' '__')
          out="$ARTIFACT_ROOT/$safe"
          mkdir -p "$out/file/$(dirname "$SOURCE_FILE")"
          cp "$SOURCE_FILE" "$out/file/$SOURCE_FILE"
          (cd "$out/file" && tar --sort=name --owner=0 --group=0 --numeric-owner -czf "../$safe.tar.gz" "$SOURCE_FILE")
          sha256sum "$out/file/$SOURCE_FILE" > "$out/$safe.sha256"
          sha256sum "$out/$safe.tar.gz" >> "$out/$safe.sha256"
          printf '%s\n' "$SOURCE_FILE" > "$out/$safe.path"

      - name: Upload selected file and digest
        uses: actions/upload-artifact@v4
        with:
          name: azure-src-shard0-${{ strategy.job-index }}
          path: artifacts/azurequantumsdk-per-file
          if-no-files-found: error
          compression-level: 6
