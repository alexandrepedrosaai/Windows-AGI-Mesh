  package-and-release:
    name: Pack NuGet and publish MajoranaSDK PhotonicSDK BrainwaveSDK
    needs: [discover, shard0, shard1, shard2, shard3]
    if: ${{ always() && needs.discover.result == 'success' && needs.shard0.result == 'success' && needs.shard1.result == 'success' && needs.shard2.result == 'success' && needs.shard3.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download every per-file artifact and digest
        uses: actions/download-artifact@v4
        with:
          pattern: azure-src-*
          path: release-assets
          merge-multiple: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@alexandrepedrosaai'

      - name: Create complete source archive and aggregate digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/complete
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf release-assets/complete/azurequantumsdk-src.tar.gz Azure/AzureQuantum/AzureQuantumSDK/src
          sha256sum release-assets/complete/azurequantumsdk-src.tar.gz > release-assets/complete/azurequantumsdk-src.tar.gz.sha256
          find release-assets -type f -print0 | sort -z | xargs -0 -r sha256sum > release-assets/complete/all-artifacts.sha256
          test -s release-assets/complete/all-artifacts.sha256

      - name: Create and pack three NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.0-ci.${GITHUB_RUN_ID}"
          mkdir -p release-assets/nuget
          for package in MajoranaSDK PhotonicSDK BrainwaveSDK; do
            work="$RUNNER_TEMP/$package"
            mkdir -p "$work"
            cat > "$work/$package.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>$package</PackageId>
              <Version>$version</Version>
              <PackageDescription>AzureQuantumSDK source and digests for $package.</PackageDescription>
              <PackageTags>azure quantum windows agi mesh</PackageTags>
              <PackageLicenseExpression>MIT</PackageLicenseExpression>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoBuild>true</NoBuild>
              <SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking>
            </PropertyGroup>
            <ItemGroup>
              <None Include="$GITHUB_WORKSPACE/Azure/AzureQuantum/AzureQuantumSDK/src/**" Pack="true" PackagePath="contentFiles/any/any/AzureQuantumSDK/src" />
              <None Include="$GITHUB_WORKSPACE/release-assets/complete/**" Pack="true" PackagePath="contentFiles/any/any/digests" />
            </ItemGroup>
          </Project>
          EOF
            dotnet pack "$work/$package.csproj" -c Release -o release-assets/nuget
          done
          sha256sum release-assets/nuget/*.nupkg > release-assets/nuget/packages.sha256

      - name: Publish NuGet packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source="https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          for package in release-assets/nuget/*.nupkg; do
            dotnet nuget push "$package" --source "$source" --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate
          done

      - name: Create and push three Docker containers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          context="$RUNNER_TEMP/azure-docker-context"
          mkdir -p "$context/src"
          cp -R Azure/AzureQuantum/AzureQuantumSDK/src/. "$context/src/"
          cat > "$context/Dockerfile" <<'EOF'
          FROM python:3.12-slim
          WORKDIR /opt/azurequantumsdk
          COPY src ./src
          CMD ["python", "-c", "print('AzureQuantumSDK workload container ready')"]
          EOF
          for image in majoranasdk photonicsdk brainwavesdk; do
            docker build -f "$context/Dockerfile" -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:latest" -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:${GITHUB_SHA:0:12}" "$context"
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:latest"
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:${GITHUB_SHA:0:12}"
            docker save "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:${GITHUB_SHA:0:12}" | gzip > "release-assets/${image}.tar.gz"
            sha256sum "release-assets/${image}.tar.gz" > "release-assets/${image}.tar.gz.sha256"
          done

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="azurequantumsdk-per-file-${GITHUB_SHA:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --draft --title "AzureQuantumSDK Per-File Matrix ${GITHUB_SHA:0:12}" --notes "Per-file AzureQuantumSDK matrix build. NuGet packages: MajoranaSDK, PhotonicSDK, BrainwaveSDK. Docker images and SHA-256 digests were generated by GitHub Actions Bot."

      - name: Upload all files, packages, containers and digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            gh release upload "${{ steps.release.outputs.tag }}" "$file" --clobber
          done

      - name: Publish official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --draft=false
