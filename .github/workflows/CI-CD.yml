name: CI-CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write
  deployments: write
  security-events: read

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION_FILE: "Windows-AGI-Mesh/Windows-AGI-Mesh.sln"
  INTEGRATION_TEST_PROJECT: "Windows-AGI-Mesh/tests/WindowsAGIMesh.SchemaTests/WindowsAGIMesh.SchemaTests.csproj"

jobs:
  dependency-review:
    name: Dependency Security Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  build-test-publish:
    name: Build Test Publish
    runs-on: ubuntu-24.04
    needs: dependency-review
    if: always() && (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: nuget-${{ runner.os }}-${{ hashFiles('Windows-AGI-Mesh/Windows-AGI-Mesh.sln','**/*.csproj','**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test "${{ env.SOLUTION_FILE }}" --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx

      - name: Integration Tests
        run: dotnet test "${{ env.INTEGRATION_TEST_PROJECT }}" --configuration Release --logger trx

      - name: Publish
        run: dotnet publish "${{ env.SOLUTION_FILE }}" --configuration Release --no-build --output publish

      - id: version
        name: Generate Version
        run: echo "version=$(date +'%Y.%m.%d').${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Published App
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-publish-${{ github.sha }}
          path: publish/
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: "**/*.trx"
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-24.04
    needs: build-test-publish
    if: needs.build-test-publish.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Sonar Begin
        run: |
          ~/.dotnet/tools/dotnet-sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      - name: Build For Sonar
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release
      - name: Sonar End
        run: ~/.dotnet/tools/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  quality-gate:
    name: Sonar Quality Gate
    runs-on: ubuntu-24.04
    needs: sonarcloud
    steps:
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Docker Build And Push
    runs-on: ubuntu-24.04
    needs: quality-gate
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-publish-${{ github.sha }}
          path: publish
      - name: Login GHCR with GitHub Actions Bot token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  release:
    name: GitHub Actions Bot Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-publish-${{ github.sha }}
          path: artifacts
      - name: Create draft, upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-cd-${GITHUB_SHA}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CI-CD ${GITHUB_SHA:0:12}" \
            --generate-notes \
            --draft
          gh release upload "$tag" artifacts/** --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  deploy:
    name: Cross-Security-Fusion Deployment
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: release
    environment:
      name: Cross-Security-Fusion
      url: https://github.com/${{ github.repository }}/deployments/Cross-Security-Fusion
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Register deployment as GitHub Actions Bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Cross-Security-Fusion',
              description: 'CI-CD deployment by GitHub Actions Bot',
              auto_merge: false,
              required_contexts: []
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Cross-Security-Fusion deployment completed',
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/deployments/Cross-Security-Fusion`
            });
            core.info(`Deployment created: ${deployment.data.html_url}`);
