              work="$RUNNER_TEMP/$safe"; mkdir -p "$work/lib"
              printf '# Generated AGIMesh catalog package\n' > "$work/lib/$safe.rb"
              cat > "$work/$safe.gemspec" <<EOF
          Gem::Specification.new do |s|; s.name='$safe'; s.version='0.1.0.${GITHUB_RUN_ID}'; s.summary='AGIMesh catalog package'; s.authors=['Windows-AGI-Mesh Team']; s.email=['agi-mesh@example.invalid']; s.files=Dir['lib/**/*.rb']; end
          EOF
              gem_output="$GITHUB_WORKSPACE/$out/$safe-0.1.0.${GITHUB_RUN_ID}.gem"
              (cd "$work" && gem build "$safe.gemspec" --output "$gem_output") ;;
            containers)
              work="$RUNNER_TEMP/$safe"; mkdir -p "$work"
              printf 'FROM scratch\nLABEL org.opencontainers.image.title="%s"\n' "$name" > "$work/Dockerfile"
              docker build -q -t "$safe:ci" "$work" > "$out/$safe.image-id" ;;
            *) echo "Unsupported ecosystem: $ecosystem" >&2; exit 1 ;;
          esac
          echo "Publishing $name to GitHub Packages ($ecosystem)"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          case "$ecosystem_key" in
            nuget)
              dotnet nuget push "$out"/*.nupkg --source "https://nuget.pkg.github.com/$owner/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate ;;
            npm)
              npm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
              npm publish "$out"/*.tgz --registry "https://npm.pkg.github.com" --access restricted ;;
            maven)
              cat > "$RUNNER_TEMP/maven-settings.xml" <<EOF
          <settings><servers><server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server></servers></settings>
          EOF
              mvn --batch-mode deploy:deploy-file -Dfile="$out/$safe-0.1.0.${GITHUB_RUN_ID}.jar" -DpomFile="$out/$safe-0.1.0.${GITHUB_RUN_ID}.pom" -DrepositoryId=github -Durl="https://maven.pkg.github.com/$owner/$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)" -s "$RUNNER_TEMP/maven-settings.xml" ;;
