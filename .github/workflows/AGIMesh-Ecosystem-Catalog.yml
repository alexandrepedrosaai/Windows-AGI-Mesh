            maven)
              mkdir -p "$RUNNER_TEMP/maven/$safe/classes"
              printf 'AGIMesh catalog package: %s\n' "$name" > "$RUNNER_TEMP/maven/$safe/classes/README.txt"
              jar --create --file "$out/$safe-0.1.0.${GITHUB_RUN_ID}.jar" -C "$RUNNER_TEMP/maven/$safe/classes" README.txt
              cat > "$out/$safe-0.1.0.${GITHUB_RUN_ID}.pom" <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.github.${GITHUB_REPOSITORY_OWNER}</groupId><artifactId>$safe</artifactId><version>0.1.0-ci.${GITHUB_RUN_ID}</version><packaging>jar</packaging><name>$name</name></project>
          EOF ;;
