          :github: Bearer $GITHUB_TOKEN
          EOF
              chmod 600 "$HOME/.gem/credentials"
              gem push "$out/$safe-0.1.0.${GITHUB_RUN_ID}.gem" --key github --host "https://rubygems.pkg.github.com/$owner" ;;
            containers)
              image="ghcr.io/$owner/$safe:0.1.0-ci.${GITHUB_RUN_ID}"
              docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
              docker build -t "$image" "$work"
              docker push "$image" ;;
            *) echo "Unsupported ecosystem: $ecosystem" >&2; exit 1 ;;
          esac
          sha256sum "$out"/* >> "$out/sha256sums.txt"
          cat > "$out/README.md" <<EOF
          # $name

          Generated by the AGIMesh Ecosystem Package Catalog workflow.
          Ecosystem: $ecosystem
          Dependency layer: ${{ matrix.package.level }}
          Category: ${{ matrix.package.category }}
          EOF
          sha256sum "$out/README.md" >> "$out/sha256sums.txt"
