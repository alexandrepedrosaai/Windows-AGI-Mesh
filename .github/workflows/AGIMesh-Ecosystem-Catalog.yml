              work="$RUNNER_TEMP/$safe"; mkdir -p "$work/lib"
              printf '# Generated AGIMesh catalog package\n' > "$work/lib/$safe.rb"
              cat > "$work/$safe.gemspec" <<EOF
          Gem::Specification.new do |s|; s.name='$safe'; s.version='0.1.0'; s.summary='AGIMesh catalog package'; s.authors=['Windows-AGI-Mesh Team']; s.email=['agi-mesh@example.invalid']; s.files=Dir['lib/**/*.rb']; end
          EOF
              gem_output="$GITHUB_WORKSPACE/$out/$safe-0.1.0.gem"
              (cd "$work" && gem build "$safe.gemspec" --output "$gem_output") ;;
            Containers)
              work="$RUNNER_TEMP/$safe"; mkdir -p "$work"
              printf 'FROM scratch\nLABEL org.opencontainers.image.title="%s"\n' "$name" > "$work/Dockerfile"
              docker build -q -t "$safe:ci" "$work" > "$out/$safe.image-id" ;;
            *) echo "Unsupported ecosystem: $ecosystem" >&2; exit 1 ;;
          esac
          sha256sum "$out"/* >> "$out/sha256sums.txt"
          cat > "$out/README.md" <<EOF
          # $name

          Generated by the AGIMesh Ecosystem Package Catalog workflow.
          Ecosystem: $ecosystem
          Dependency layer: ${{ matrix.package.level }}
          Category: ${{ matrix.package.category }}
          EOF
          sha256sum "$out/README.md" >> "$out/sha256sums.txt"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: agimesh-${{ matrix.package.id }}
          path: artifacts/agimesh-ecosystem/${{ matrix.package.id }}
          if-no-files-found: error
          compression-level: 6

  release:
    name: Aggregate artifacts and publish release
    needs: [discover, build-level0, build-level1, build-level2, build-level3, build-ultra]
    if: ${{ always() && needs.discover.result == 'success' && needs.build-level0.result == 'success' && needs.build-level1.result == 'success' && needs.build-level2.result == 'success' && needs.build-level3.result == 'success' && needs.build-ultra.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agimesh-pkg-*
          path: release-assets
          merge-multiple: true
      - name: Create catalog and aggregate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cp "$CATALOG" release-assets/agimesh-package-catalog.json
          cp docs/AGIMesh-Package-Ecosystem.md release-assets/AGIMesh-Package-Ecosystem.md
          find release-assets -type f -print0 | sort -z | xargs -0 -r sha256sum > release-assets/all-artifacts.sha256
          test -s release-assets/all-artifacts.sha256
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="agimesh-ecosystem-${GITHUB_SHA:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --draft --title "AGIMesh Ecosystem Catalog ${GITHUB_SHA:0:12}" --notes "Automated catalog build for 131 NuGet, npm, Maven, RubyGems, and OCI entries. All per-package artifacts and SHA-256 manifests were generated by GitHub Actions Bot."
      - name: Upload all package artifacts and digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | while IFS= read -r -d '' file; do gh release upload "${{ steps.release.outputs.tag }}" "$file" --clobber; done
      - name: Publish official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --draft=false
