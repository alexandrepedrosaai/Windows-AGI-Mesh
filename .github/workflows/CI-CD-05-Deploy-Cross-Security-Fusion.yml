name: CI-CD 05 Deploy Cross-Security-Fusion

on:
  workflow_run:
    workflows: ["CI-CD 04 Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cross-Security-Fusion Deployment
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    environment:
      name: Cross-Security-Fusion
      url: https://github.com/${{ github.repository }}/deployments/Cross-Security-Fusion
    steps:
      - name: Register deployment as GitHub Actions Bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const ref = context.payload.workflow_run?.head_sha || context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'Cross-Security-Fusion',
              description: 'CI-CD deployment by GitHub Actions Bot',
              auto_merge: false,
              required_contexts: []
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Cross-Security-Fusion deployment completed',
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/deployments/Cross-Security-Fusion`
            });
            core.info(`Deployment created: ${deployment.data.html_url}`);
