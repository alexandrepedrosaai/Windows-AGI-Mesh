name: Validate Code Review Pipeline

on:
  pull_request:
    paths:
      - ".github/schemas/**"
      - ".github/workflows/TaskSkills.yml"
      - ".github/skills/code-review/**"

  push:
    branches:
      - main
    paths:
      - ".github/schemas/**"
      - ".github/workflows/TaskSkills.yml"
      - ".github/skills/code-review/**"

permissions:
  contents: read

concurrency:
  group: code-review-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Tools
        run: |
          set -euo pipefail
          npm install -g ajv-cli@5.0.0 ajv@8 ajv-formats@3
          if command -v jq >/dev/null 2>&1; then
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Repository Diagnostics
        run: |
          set -euo pipefail
          git branch --show-current || true
          git rev-parse HEAD || true
          ls -la
          find .github -type f | sort || true

      - name: Verify required files exist
        run: |
          set -euo pipefail
          required_files=(
            ".github/schemas/review-output.schema.json"
            ".github/schemas/sample-review-output.json"
            ".github/schemas/policy-check.py"
            ".github/skills/code-review/SKILL.md"
          )
          optional_files=(
            ".github/schemas/invalid-schema.json"
            ".github/schemas/invalid-build-failure.json"
            ".github/schemas/invalid-test-failure.json"
            ".github/schemas/invalid-security-failure.json"
            ".github/schemas/invalid-high-finding.json"
            ".github/schemas/invalid-critical-finding.json"
          )
          missing_required=0
          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Found: $file"
            else
              echo "Missing: $file"
              missing_required=1
            fi
          done
          for file in "${optional_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Found fixture: $file"
            else
              echo "Optional fixture missing: $file"
            fi
          done
          exit "$missing_required"

      - name: Validate schema syntax
        run: jq empty .github/schemas/review-output.schema.json

      - name: Validate JSON syntax
        run: |
          set -euo pipefail
          files=(
            ".github/schemas/review-output.schema.json"
            ".github/schemas/sample-review-output.json"
            ".github/schemas/invalid-schema.json"
            ".github/schemas/invalid-build-failure.json"
            ".github/schemas/invalid-test-failure.json"
            ".github/schemas/invalid-security-failure.json"
            ".github/schemas/invalid-high-finding.json"
            ".github/schemas/invalid-critical-finding.json"
          )
          for file in "${files[@]}"; do
            echo "Checking syntax: $file"
            jq empty "$file"
          done

      - name: Compile policy checker
        run: python -m py_compile .github/schemas/policy-check.py

      - name: Validate positive sample
        run: |
          ajv validate --spec=draft2020 -c ajv-formats \
            -s .github/schemas/review-output.schema.json \
            -d .github/schemas/sample-review-output.json

      - name: Validate optional schema fixtures
        run: |
          set -euo pipefail
          fixtures=(
            ".github/schemas/invalid-build-failure.json"
            ".github/schemas/invalid-test-failure.json"
            ".github/schemas/invalid-security-failure.json"
            ".github/schemas/invalid-high-finding.json"
            ".github/schemas/invalid-critical-finding.json"
          )
          for file in "${fixtures[@]}"; do
            if [[ -f "$file" ]]; then
              ajv validate --spec=draft2020 -c ajv-formats \
                -s .github/schemas/review-output.schema.json -d "$file"
            fi
          done

      - name: Validate invalid schema sample fails
        if: ${{ hashFiles('.github/schemas/invalid-schema.json') != '' }}
        run: |
          if ajv validate --spec=draft2020 -c ajv-formats \
            -s .github/schemas/review-output.schema.json \
            -d .github/schemas/invalid-schema.json; then
            echo "ERROR: invalid-schema.json unexpectedly passed"
            exit 1
          fi

      - name: Policy validation positive sample
        run: |
          python .github/schemas/policy-check.py \
            .github/schemas/sample-review-output.json

      - name: Policy test - High finding
        if: ${{ hashFiles('.github/schemas/invalid-high-finding.json') != '' }}
        run: |
          if python .github/schemas/policy-check.py .github/schemas/invalid-high-finding.json; then
            echo "ERROR: invalid-high-finding.json unexpectedly passed"
            exit 1
          fi

      - name: Policy test - Critical finding
        if: ${{ hashFiles('.github/schemas/invalid-critical-finding.json') != '' }}
        run: |
          if python .github/schemas/policy-check.py .github/schemas/invalid-critical-finding.json; then
            echo "ERROR: invalid-critical-finding.json unexpectedly passed"
            exit 1
          fi

      - name: Policy test - Build failure
        if: ${{ hashFiles('.github/schemas/invalid-build-failure.json') != '' }}
        run: |
          if python .github/schemas/policy-check.py .github/schemas/invalid-build-failure.json; then
            echo "ERROR: invalid-build-failure.json unexpectedly passed"
            exit 1
          else
            echo "PASS: Build failure rejected"
          fi

      - name: Policy test - Test failure
        if: ${{ hashFiles('.github/schemas/invalid-test-failure.json') != '' }}
        run: |
          if python .github/schemas/policy-check.py .github/schemas/invalid-test-failure.json; then
            echo "ERROR: invalid-test-failure.json unexpectedly passed"
            exit 1
          else
            echo "PASS: Test failure rejected"
          fi
