name: Windows AGI Mesh CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  SOLUTION: Windows-AGI-Mesh/Windows-AGI-Mesh.sln

jobs:
  build-test:
    name: Restore, build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show toolchain
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "$env:SOLUTION"

      - name: Build Release
        run: dotnet build "$env:SOLUTION" --configuration Release --no-restore --nologo

      - name: Run tests
        run: >
          dotnet test "$env:SOLUTION"
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory Windows-AGI-Mesh/TestResults

      - name: CLI smoke test
        working-directory: Windows-AGI-Mesh
        run: |
          dotnet run --project WindowsAGIMesh.Cli/WindowsAGIMesh.Cli.csproj --configuration Release --no-build --no-restore -- help
          dotnet run --project WindowsAGIMesh.Cli/WindowsAGIMesh.Cli.csproj --configuration Release --no-build --no-restore -- version

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-agi-mesh-test-results
          path: Windows-AGI-Mesh/TestResults/**
          if-no-files-found: warn
