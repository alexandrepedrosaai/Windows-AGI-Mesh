name: Build and Push Iceberg Replication Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/iceberg-replication/**'
      - '.github/workflows/iceberg-replication.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/iceberg-replication/**'
      - '.github/workflows/iceberg-replication.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/windows-agi-mesh-iceberg-replication

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Verify replication package sources
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/iceberg-replication/Dockerfile.bootstrap
          test -f packages/iceberg-replication/java/pom.xml
          test -f packages/iceberg-replication/scripts/requirements.txt
          test -f packages/iceberg-replication/scripts/bootstrap.sh
          test -d packages/iceberg-replication/resources

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tag="pr-${{ github.event.number }}"
          else
            tag="latest"
          fi
          {
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build replication image
        uses: docker/build-push-action@v7
        with:
          context: ./packages/iceberg-replication
          file: ./packages/iceberg-replication/Dockerfile.bootstrap
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=iceberg-replication
          cache-to: type=gha,mode=max,scope=iceberg-replication
