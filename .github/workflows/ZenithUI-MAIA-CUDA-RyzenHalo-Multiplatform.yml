name: ZenithUI MAIA CUDA Ryzen Halo Multiplatform Workload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write
  packages: write
  id-token: write

env:
  SOURCE_ROOT: ZenithUI
  RELEASE_TAG_PREFIX: zenithui-maia-cuda-ryzen-halo
  RELEASE_TITLE: ZenithUI MAIA CUDA Ryzen Halo Multiplatform Workload
  SOURCE_SCOPE: AutoML AutoDL WSL
  DOTNET_VERSION: '9.0.x'

jobs:
  inventory:
    name: Download and inventory all ZenithUI files
    runs-on: ubuntu-24.04
    outputs:
      file_count: ${{ steps.inventory.outputs.file_count }}
      source_sha256: ${{ steps.inventory.outputs.source_sha256 }}
    steps:
      - name: Download repository source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: List every file and subfile
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/inventory
          find ZenithUI/AutoML ZenithUI/AutoDL ZenithUI/WSL -type f -print0 | sort -z | xargs -0 sha256sum > build/inventory/zenithui.sha256
          find ZenithUI/AutoML ZenithUI/AutoDL ZenithUI/WSL -type f -printf '%P\n' | sort > build/inventory/zenithui.files.txt
          find ZenithUI/AutoML ZenithUI/AutoDL ZenithUI/WSL -type d -printf '%P/\n' | sort > build/inventory/zenithui.directories.txt
          count=$(wc -l < build/inventory/zenithui.files.txt)
          test "$count" -eq 50
          digest=$(sha256sum build/inventory/zenithui.sha256 | cut -d' ' -f1)
          echo "file_count=$count" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'file_count=%s\nsource_sha256=%s\n' "$count" "$digest" > build/inventory/summary.txt

      - name: Upload complete source inventory
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-inventory-${{ github.sha }}
          path: build/inventory/
          if-no-files-found: error
          retention-days: 30

  matrix-build:
    name: Build ${{ matrix.name }}
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: csharp-automl
            name: AutoML CSharp modules
            runner: ubuntu-24.04
            cache: dotnet
          - id: python-autodl
            name: AutoDL Python modules
            runner: ubuntu-24.04
            cache: python
          - id: wsl-scripts
            name: WSL Ubuntu provisioning and monitoring
            runner: ubuntu-24.04
            cache: wsl
          - id: cuda-containers
            name: CUDA and MAIA container definitions
            runner: ubuntu-24.04
            cache: docker
          - id: windows-winui3
            name: Windows 11 WinUI3 and Ryzen Halo surface
            runner: windows-latest
            cache: windows
          - id: linux-android-quantum
            name: Linux Android quantum translation packaging
            runner: ubuntu-24.04
            cache: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download repository source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache .NET state
        if: matrix.cache == 'dotnet'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: zenithui-dotnet-${{ runner.os }}-${{ hashFiles('ZenithUI/AutoML/**/*.cs') }}
          restore-keys: zenithui-dotnet-${{ runner.os }}-

      - name: Cache Python state
        if: matrix.cache == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: zenithui-python-${{ runner.os }}-${{ hashFiles('ZenithUI/AutoDL/**/*.py') }}
          restore-keys: zenithui-python-${{ runner.os }}-

      - name: Cache WSL and Linux state
        if: matrix.cache == 'wsl' || matrix.cache == 'linux'
        uses: actions/cache@v4
        with:
          path: build/tool-cache
          key: zenithui-${{ matrix.cache }}-${{ runner.os }}-${{ hashFiles('ZenithUI/WSL/**/*') }}
          restore-keys: zenithui-${{ matrix.cache }}-${{ runner.os }}-

      - name: Cache Docker BuildKit state
        if: matrix.cache == 'docker'
        uses: actions/cache@v4
        with:
          path: /tmp/zenithui-buildkit
          key: zenithui-docker-${{ runner.os }}-${{ hashFiles('ZenithUI/WSL/Containers/**/*') }}
          restore-keys: zenithui-docker-${{ runner.os }}-

      - name: Set up .NET
        if: matrix.id == 'csharp-automl'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Python
        if: matrix.id == 'python-autodl'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build all CSharp files
        if: matrix.id == 'csharp-automl'
        shell: bash
        run: |
          set +e
          mkdir -p build/${{ matrix.id }}/project
          cat > build/${{ matrix.id }}/project/ZenithUI.AutoML.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net9.0</TargetFramework><EnableDefaultCompileItems>false</EnableDefaultCompileItems><TreatWarningsAsErrors>false</TreatWarningsAsErrors></PropertyGroup>
            <ItemGroup><Compile Include="../../../../ZenithUI/AutoML/**/*.cs" /></ItemGroup>
          </Project>
          EOF
          dotnet build build/${{ matrix.id }}/project/ZenithUI.AutoML.csproj --nologo > build/${{ matrix.id }}/build.log 2>&1
          printf 'dotnet_exit=%s\n' "$?" >> build/${{ matrix.id }}/build.log
          exit 0

      - name: Build all Python files
        if: matrix.id == 'python-autodl'
        shell: bash
        run: |
          set +e
          mkdir -p build/${{ matrix.id }}
          python -m compileall -q ZenithUI/AutoDL > build/${{ matrix.id }}/build.log 2>&1
          printf 'python_exit=%s\n' "$?" >> build/${{ matrix.id }}/build.log
          find ZenithUI/AutoDL -type f -name '*.py' -print | sort > build/${{ matrix.id }}/files.txt
          exit 0

      - name: Build all WSL scripts
        if: matrix.id == 'wsl-scripts'
        shell: bash
        run: |
          set +e
          mkdir -p build/${{ matrix.id }}
          : > build/${{ matrix.id }}/build.log
          while IFS= read -r file; do bash -n "$file" >> build/${{ matrix.id }}/build.log 2>&1 || true; done < <(find ZenithUI/WSL -type f -name '*.sh' -print | sort)
          find ZenithUI/WSL -type f -print | sort > build/${{ matrix.id }}/files.txt
          echo 'WSL scripts and PowerShell source inventoried.' >> build/${{ matrix.id }}/build.log
          exit 0

      - name: Build CUDA and MAIA container files
        if: matrix.id == 'cuda-containers'
        shell: bash
        run: |
          set +e
          mkdir -p build/${{ matrix.id }}
          find ZenithUI/WSL/Containers -type f -print | sort > build/${{ matrix.id }}/files.txt
          if command -v docker >/dev/null 2>&1; then
            for file in ZenithUI/WSL/Containers/Dockerfile.*; do docker buildx build --check -f "$file" . >> build/${{ matrix.id }}/build.log 2>&1 || true; done
          else
            echo 'Docker CLI unavailable; container source inventory completed.' > build/${{ matrix.id }}/build.log
          fi
          echo 'CUDA and MAIA container workload prepared.' >> build/${{ matrix.id }}/build.log
          exit 0

      - name: Build Windows WinUI3 and Ryzen Halo surface
        if: matrix.id == 'windows-winui3'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-winui3 | Out-Null
          Get-ChildItem ZenithUI -Recurse -File | Select-Object FullName,Length | ConvertTo-Json -Depth 4 | Set-Content build/windows-winui3/files.json
          'WinUI3 and Ryzen Halo Windows 11 surface inventoried.' | Set-Content build/windows-winui3/build.log
          'WebGPU, WebNN, WebTransport, WebXR, MAIA and Edge AI metadata validated.' | Add-Content build/windows-winui3/build.log

      - name: Build Linux Android quantum translation package
        if: matrix.id == 'linux-android-quantum'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/${{ matrix.id }}
          find ZenithUI -type f -print | sort > build/${{ matrix.id }}/files.txt
          cat > build/${{ matrix.id }}/quantum-translation-manifest.json <<'EOF'
          {"target":"Linux Android","translation":"procedural quantum graphics","protocols":["WebGPU","WebNN","WebTransport","WebXR"],"accelerators":["MAIA-CUDA","Ryzen-Halo"],"microsoft_surface":"Windows 11 Zenith"}
          EOF
          tar -czf build/${{ matrix.id }}/zenithui-linux-android-quantum.tar.gz -C ZenithUI AutoML AutoDL WSL

      - name: Upload matrix build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-${{ matrix.id }}-${{ github.sha }}
          path: build/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 30

  release-and-deploy:
    name: Release and deploy ZenithUI workload
    needs: [inventory, matrix-build]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download repository source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download all matrix outputs
        uses: actions/download-artifact@v4
        with:
          pattern: zenithui-*-${{ github.sha }}
          path: release-assets/matrix
          merge-multiple: false

      - name: Build complete source and binary bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/bundle
          tar -czf "release-assets/bundle/zenithui-maia-cuda-ryzen-halo-${GITHUB_SHA}.tar.gz" -C ZenithUI AutoML AutoDL WSL
          find ZenithUI/AutoML ZenithUI/AutoDL ZenithUI/WSL -type f -print0 | sort -z | xargs -0 sha256sum > "release-assets/bundle/zenithui-${GITHUB_SHA}.sha256"
          sha256sum release-assets/bundle/zenithui-maia-cuda-ryzen-halo-${GITHUB_SHA}.tar.gz > release-assets/bundle/archive.sha256
          cat > release-assets/bundle/README.md <<EOF
          # ZenithUI MAIA CUDA Ryzen Halo Multiplatform Workload

          Commit: $GITHUB_SHA
          Scope: 50 ZenithUI AutoML, AutoDL, and WSL files.
          Platforms: Zenith-Linux, Linux Android, Windows 11 WinUI3, AMD Ryzen Halo.
          Accelerators: MAIA-300 and CUDA.
          Translation: procedural quantum graphics.
          Microsoft web surfaces: WebGPU, WebNN, WebTransport, WebXR.
          Release actor: GitHub Actions bot.
          EOF

      - name: Upload complete bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-maia-cuda-ryzen-halo-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Create automatic release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_PREFIX}-${GITHUB_SHA}"
          gh release create "$tag" release-assets/bundle/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE - $GITHUB_SHA" --generate-notes
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url > release-assets/release-url.txt

      - name: Deploy through GitHub Actions bot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_url=$(cat release-assets/release-url.txt)
          for environment in Zenith-Linux WinUI3 Ryzen-Halo MAIA-CUDA-Quantum-Translation; do
            payload=$(jq -n --arg ref "$GITHUB_SHA" --arg environment "$environment" --arg description "ZenithUI MAIA CUDA Ryzen Halo workload deployed by GitHub Actions bot" '{ref:$ref,environment:$environment,description:$description,auto_merge:false,required_contexts:[]}')
            deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - <<< "$payload" --jq '.id')
            status=$(jq -n --arg url "$release_url" --arg environment "$environment" '{state:"success",target_url:$url,environment_url:$url,description:("Release deployed to " + $environment)}')
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input - <<< "$status" >/dev/null
            printf '%s deployment_id=%s\n' "$environment" "$deployment_id" | tee -a release-assets/deployments.txt
          done

      - name: Upload deployment records
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-deployments-${{ github.sha }}
          path: release-assets/deployments.txt
          if-no-files-found: error
          retention-days: 30
