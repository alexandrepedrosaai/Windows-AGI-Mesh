name: AGIMesh Modules Quality

on:
  push:
    paths:
      - "modules/**/*.qs"
      - ".github/workflows/modules-quality.yml"

  pull_request:
    paths:
      - "modules/**/*.qs"
      - ".github/workflows/modules-quality.yml"

  workflow_dispatch:

# Default to least privilege.
permissions:
  contents: read

concurrency:
  group: agimesh-modules-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflow:
    name: Validate GitHub Actions workflow
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build-test:
    name: Quality - ${{ matrix.os }} - ${{ matrix.module }}

    needs:
      - lint-workflow

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        module:
          - modules/DeepSpace.qs
          - modules/EdgeAIApp.qs
          - modules/MagneticMajorana.qs
          - modules/Nemotron.qs
          - modules/XboxQuantumXR.qs

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Verify module exists
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking module..."
          test -f "${{ matrix.module }}"
          test -s "${{ matrix.module }}"
          echo "Module found."

      - name: Validate QS module metadata
        shell: bash
        run: |
          set -euo pipefail

          FILE="${{ matrix.module }}"

          if ! grep -Eq '^// module: ' "$FILE"; then
            echo "Missing module declaration"
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*version = "' "$FILE"; then
            echo "Missing version metadata"
            exit 1
          fi

          if ! grep -Eq '^// author: ' "$FILE"; then
            echo "Missing author metadata"
            exit 1
          fi

      - name: Validate forbidden tokens
        shell: bash
        run: |
          set -euo pipefail

          FILE="${{ matrix.module }}"

          if grep -q "TODO_ERROR" "$FILE"; then
            echo "TODO_ERROR detected"
            exit 1
          fi

          if grep -q "FIXME" "$FILE"; then
            echo "FIXME detected"
            exit 1
          fi

      - name: Validate QS structure
        shell: bash
        env:
          MODULE_PATH: ${{ matrix.module }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["MODULE_PATH"])

          text = path.read_text(
              encoding="utf-8",
              errors="ignore",
          )

          if text.count("{") != text.count("}"):
              raise SystemExit(
                  f"Brace mismatch in {path}"
              )

          if text.count("(") != text.count(")"):
              raise SystemExit(
                  f"Parenthesis mismatch in {path}"
              )

          if text.count("[") != text.count("]"):
              raise SystemExit(
                  f"Bracket mismatch in {path}"
              )

          print("QS structural validation passed.")
          PY

      - name: Compile Q# module
        shell: bash
        env:
          MODULE_PATH: ${{ matrix.module }}
        run: |
          set -euo pipefail

          if [ -x "./scripts/compile-qsharp.sh" ]; then
            ./scripts/compile-qsharp.sh "$MODULE_PATH"
          else
            echo "::error::Missing scripts/compile-qsharp.sh"
            echo "Add the repository-specific QDK compilation command."
            exit 1
          fi

      - name: Run Q# unit tests
        shell: bash
        env:
          MODULE_PATH: ${{ matrix.module }}
        run: |
          set -euo pipefail

          if [ -x "./scripts/test-qsharp.sh" ]; then
            ./scripts/test-qsharp.sh "$MODULE_PATH"
          else
            echo "::error::Missing scripts/test-qsharp.sh"
            echo "Add the repository-specific QDK unit-test command."
            exit 1
          fi

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sbom

          syft . \
            --output cyclonedx-json \
            > sbom/agimesh-sbom.json

      - name: Generate SHA256 Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p hash

          if command -v sha256sum >/dev/null 2>&1; then
            HASH_CMD="sha256sum"
          else
            HASH_CMD="shasum -a 256"
          fi

          $HASH_CMD \
            "${{ matrix.module }}" \
            > "hash/$(basename "${{ matrix.module }}").sha256"

      - name: Generate SHA256 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            hash

          $file = Get-Item "${{ matrix.module }}"

          Get-FileHash `
            $file.FullName `
            -Algorithm SHA256 |
            Format-List |
            Out-File `
            "hash/$($file.Name).sha256"

      - name: Package module Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          MODULE_NAME=$(
            basename "${{ matrix.module }}" .qs
          )

          tar \
            -czf \
            "dist/${MODULE_NAME}-${{ matrix.os }}.tar.gz" \
            "${{ matrix.module }}"

      - name: Package module Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            dist

          $ModuleName = `
            [System.IO.Path]::GetFileNameWithoutExtension(
              "${{ matrix.module }}"
            )

          Compress-Archive `
            -Path "${{ matrix.module }}" `
            -DestinationPath `
            "dist/$ModuleName-${{ matrix.os }}.zip" `
            -Force

      - name: Prepare artifact name
        id: artifact_name
        shell: bash
        run: |
          set -euo pipefail

          MODULE_NAME=$(
            basename "${{ matrix.module }}" .qs
          )

          echo \
            "module_name=${MODULE_NAME}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            quality-${{ matrix.os }}-${{
            steps.artifact_name.outputs.module_name }}
          path: |
            sbom/**
            hash/**
            dist/**

      - name: Generate attestation Linux/macOS
        if: runner.os != 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Generate attestation Windows
        if: runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

  create-quality-pr:
    name: Create Quality Pull Request from existing branch

    needs:
      - build-test

    if: >-
      github.event_name != 'pull_request' &&
      github.ref != 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Create or reuse Pull Request as GitHub Actions Bot
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const head = process.env.HEAD_BRANCH;
            const base = 'main';

            if (!head || head === base) {
              core.setFailed(
                'A non-main correction branch is required ' +
                'to create the Pull Request.'
              );
              return;
            }

            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base,
              head: `${context.repo.owner}:${head}`
            });

            if (existing.data.length > 0) {
              const url = existing.data[0].html_url;

              core.info(
                `Pull Request already exists: ${url}`
              );

              core.setOutput(
                'pull_request_url',
                url
              );

              return;
            }

            const pull = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title: 'AGIMesh Modules Quality Automation',
              body: `## Automated Quality Pipeline

            This Pull Request was opened automatically by GitHub Actions Bot from the existing correction branch \`${head}\`.

            ### Corrections

            - Added QS module, version, and author metadata.
            - Added Q# compilation and unit-test gates.
            - Preserved QS structural validation.
            - Added workflow validation with actionlint.
            - Applied least-privilege workflow permissions.
            - Avoided creating a restricted auxiliary branch.
            - Kept artifact names safe for all operating systems.

            ### Modules

            - DeepSpace.qs
            - EdgeAIApp.qs
            - MagneticMajorana.qs
            - Nemotron.qs
            - XboxQuantumXR.qs`
            });

            core.info(
              `Pull Request created: ${pull.data.html_url}`
            );

            core.setOutput(
              'pull_request_url',
              pull.data.html_url
            );
