name: CI-CD 01 Dependency Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: No PR dependency review required
        if: github.event_name != 'pull_request'
        run: echo "Dependency Review is only applicable to pull requests; push gate passed."
