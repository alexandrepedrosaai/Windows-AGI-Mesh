name: CI-CD 03 Docker Build Push

on:
  workflow_run:
    workflows: ["CI-CD 02 Build Test Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker-build:
    name: Docker Build And Push
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Login GHCR with GitHub Actions Bot token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Export image metadata
        run: |
          mkdir -p docker-metadata
          printf '%s\n' "${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}" > docker-metadata/image.txt
      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-metadata-${{ github.event.workflow_run.head_sha || github.sha }}
          path: docker-metadata/image.txt
