name: CI-CD 03 ZenithUI Docker Build Push

on:
  workflow_run:
    workflows: ["CI-CD 02 Build Test Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  # OCI image names are case-sensitive and must be lowercase.
  IMAGE: ghcr.io/alexandrepedrosaai/zenithui
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Five parallel cache lanes for the Q# stage.
  qsharp-cache:
    name: ZenithUI QSharp Cache ${{ matrix.shard }}
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name ==
      github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            cache_scope: zenithui-qsharp-1
          - shard: 2
            cache_scope: zenithui-qsharp-2
          - shard: 3
            cache_scope: zenithui-qsharp-3
          - shard: 4
            cache_scope: zenithui-qsharp-4
          - shard: 5
            cache_scope: zenithui-qsharp-5
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build QSharp stage shard ${{ matrix.shard }} and cache it
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: qsharp-build
          push: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  neural-cache:
    name: ZenithUI VA Q-learning Neural Cache
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name ==
      github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build VA Q-learning Neural stage and cache it
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: neural-build
          push: false
          cache-from: type=gha,scope=zenithui-neural
          cache-to: type=gha,mode=max,scope=zenithui-neural

  docker-publish:
    name: Build And Push ZenithUI
    needs: [qsharp-cache, neural-cache]
    if: >-
      needs.qsharp-cache.result == 'success' &&
      needs.neural-cache.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name ==
      github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Login GHCR with GitHub Actions Bot token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx with cache-capable driver
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build And Push ZenithUI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          # Consume all five Q# caches, the neural cache, and the final-image cache.
          cache-from: |
            type=gha,scope=zenithui-qsharp-1
            type=gha,scope=zenithui-qsharp-2
            type=gha,scope=zenithui-qsharp-3
            type=gha,scope=zenithui-qsharp-4
            type=gha,scope=zenithui-qsharp-5
            type=gha,scope=zenithui-neural
            type=gha,scope=zenithui-final
          cache-to: type=gha,mode=max,scope=zenithui-final
      - name: Pull published ZenithUI container
        run: |
          set -euo pipefail
          image_ref="${IMAGE}:${IMAGE_TAG}"
          docker pull "$image_ref"
          docker image inspect "$image_ref" >/dev/null
      - name: Run VA Q-learning neural polymorphic reconstruction
        run: |
          set -euo pipefail
          mkdir -p docker-metadata
          image_ref="${IMAGE}:${IMAGE_TAG}"
          docker run --rm "$image_ref" \
            dotnet /opt/vaql/VAQLearningNeural.dll --reconstruct \
            | tee docker-metadata/va-qlearning-reconstruction.txt
      - name: Export image metadata
        run: |
          mkdir -p docker-metadata
          printf '%s\n' "${IMAGE}:${IMAGE_TAG}" > docker-metadata/image.txt
      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-image-metadata-${{ env.IMAGE_TAG }}
          path: docker-metadata/
