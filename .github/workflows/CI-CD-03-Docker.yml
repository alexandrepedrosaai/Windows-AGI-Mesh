name: CI-CD 03 ZenithUI Docker Build Push

on:
  workflow_run:
    workflows: ["CI-CD 02 Build Test Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # OCI image names are case-sensitive and must be lowercase.
  IMAGE: ghcr.io/alexandrepedrosaai/zenithui
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  docker-build:
    name: ZenithUI Docker Build And Push
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name ==
      github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Login GHCR with GitHub Actions Bot token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build And Push ZenithUI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
      - name: Pull published ZenithUI container
        run: |
          set -euo pipefail
          image_ref="${IMAGE}:${IMAGE_TAG}"
          docker pull "$image_ref"
          docker image inspect "$image_ref" >/dev/null
      - name: Run VA Q-learning neural polymorphic reconstruction
        run: |
          set -euo pipefail
          mkdir -p docker-metadata
          image_ref="${IMAGE}:${IMAGE_TAG}"
          docker run --rm "$image_ref" \
            dotnet /opt/vaql/VAQLearningNeural.dll --reconstruct \
            | tee docker-metadata/va-qlearning-reconstruction.txt
      - name: Export image metadata
        run: |
          mkdir -p docker-metadata
          printf '%s\n' "${IMAGE}:${IMAGE_TAG}" > docker-metadata/image.txt
      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: zenithui-image-metadata-${{ env.IMAGE_TAG }}
          path: docker-metadata/
