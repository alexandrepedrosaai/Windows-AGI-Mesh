name: Windows AGI Mesh Docker Source Packages

on:
  push:
    branches:
      - main
    paths:
      - "WebTransporte/**"
      - "modules/**"
      - "Windows-AGI-Mesh-Quantum/src/PhotonicAcceleration/**"
      - "docker/**"
      - ".github/workflows/docker-source-packages.yml"

  pull_request:
    paths:
      - "WebTransporte/**"
      - "modules/**"
      - "Windows-AGI-Mesh-Quantum/src/PhotonicAcceleration/**"
      - "docker/**"
      - ".github/workflows/docker-source-packages.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/alexandrepedrosaai/windows-agi-mesh
  IMAGE_LIST: /tmp/agimesh-images.txt
  PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' }}

jobs:
  build-source-packages:
    name: Build, test and publish Docker source images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker package manifest
        shell: bash
        run: |
          set -euo pipefail

          test -f docker/manifest.json
          test -f docker/Dockerfile.all
          test -f docker/entrypoint.sh
          test -f docker/entrypoint-all.sh
          test -d docker/targets

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("docker/manifest.json").read_text(encoding="utf-8")
          )
          packages = manifest.get("packages", [])

          if not packages:
              raise SystemExit("No Docker packages found in manifest")

          for package in packages:
              source = Path(package["source"])
              dockerfile = Path(package["dockerfile"])

              if not source.is_file():
                  raise SystemExit(f"Missing Docker source file: {source}")

              if not dockerfile.is_file():
                  raise SystemExit(f"Missing Dockerfile: {dockerfile}")

          print(f"Validated {len(packages)} Docker packages")
          PY

          : > "$IMAGE_LIST"
          mkdir -p docker-artifacts

      - name: Build every individual source image
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r dockerfile; do
            package_dir="$(dirname "$dockerfile")"
            package_name="$(basename "$package_dir")"
            image="${IMAGE_PREFIX}:${package_name}"

            echo "Building individual image: ${image}"

            docker buildx build \
              --file "$dockerfile" \
              --tag "$image" \
              --load \
              .

            docker image inspect "$image" >/dev/null
            printf '%s\n' "$image" >> "$IMAGE_LIST"
          done < <(
            find docker/targets \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name Dockerfile \
              -print \
              | sort
          )

      - name: Build aggregate Docker image
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_PREFIX}:all"

          docker buildx build \
            --file docker/Dockerfile.all \
            --tag "$image" \
            --load \
            .

          docker image inspect "$image" >/dev/null
          printf '%s\n' "$image" >> "$IMAGE_LIST"

      - name: Test aggregate image
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint /bin/sh \
            "${IMAGE_PREFIX}:all" \
            -c '
              test -d /opt/agi-mesh/repository/WebTransporte &&
              test -d /opt/agi-mesh/repository/modules &&
              test -d /opt/agi-mesh/repository/Windows-AGI-Mesh-Quantum/src/PhotonicAcceleration &&
              echo "Aggregate image validation passed"
            '

      - name: Test Python source packages
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r dockerfile; do
            package_dir="$(dirname "$dockerfile")"
            package_name="$(basename "$package_dir")"

            if [[ "$package_name" == *"-py" ]]; then
              image="${IMAGE_PREFIX}:${package_name}"
              echo "Testing Python package: ${image}"
              docker run --rm "$image"
            fi
          done < <(
            find docker/targets \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name Dockerfile \
              -print \
              | sort
          )

      - name: Publish Docker images to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s "$IMAGE_LIST"
          sort -u "$IMAGE_LIST" -o "$IMAGE_LIST"

          while IFS= read -r image; do
            echo "Publishing ${image}"
            docker push "$image"
          done < "$IMAGE_LIST"

      - name: Export Docker images as workflow artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s "$IMAGE_LIST"
          sort -u "$IMAGE_LIST" -o "$IMAGE_LIST"

          docker save $(cat "$IMAGE_LIST") \
            | gzip -9 > docker-artifacts/windows-agi-mesh-images.tar.gz

          tar -czf docker-artifacts/windows-agi-mesh-source-files.tar.gz \
            docker

          test -s docker-artifacts/windows-agi-mesh-images.tar.gz
          test -s docker-artifacts/windows-agi-mesh-source-files.tar.gz

      - name: Upload Docker packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-agi-mesh-docker-packages
          path: docker-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Generate package summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows AGI Mesh Docker Packages"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image prefix: ${IMAGE_PREFIX}"
            echo "- GHCR publication: ${PUBLISH_IMAGES}"
            echo "- Package tags: individual source tags plus all"
            echo
            echo "Published images are available at:"
            echo "https://github.com/${GITHUB_REPOSITORY}/pkgs/container/windows-agi-mesh"
          } >> "$GITHUB_STEP_SUMMARY"
