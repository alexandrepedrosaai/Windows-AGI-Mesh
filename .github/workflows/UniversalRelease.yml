name: Universal Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write
  deployments: write
  packages: write

env:
  NODE_VERSION: "22"

jobs:

  validate-version:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - id: version

        shell: bash

        run: |

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:

    needs:
      - validate-version

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4

      # NODE

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:coverage

      - run: npm run build

      # DOTNET

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      - run: dotnet build -c Release

      # Q#

      - run: |
          dotnet publish \
            WebGPU/Majorana-Starship/MajoranaStarship.qsproj \
            -c Release \
            -o publish

      # ZIPS

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd publish
          zip -r ../MajoranaStarship-linux-x64.zip .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd publish
          zip -r ../MajoranaStarship-osx-arm64.zip .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish/* `
            -DestinationPath MajoranaStarship-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            *.zip

  docker:

    needs:
      - build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker
        run: |
          docker build \
            -t edge-ai:${{ github.ref_name }} \
            -f docker/Dockerfile .

  deploy:

    needs:
      - docker

    runs-on: ubuntu-latest

    outputs:
      deployment_id: ${{ steps.deploy.outputs.id }}

    steps:

      - id: deploy

        uses: actions/github-script@v7

        with:
          script: |

            const deployment =
              await github.rest.repos.createDeployment({

                owner: context.repo.owner,
                repo: context.repo.repo,

                ref: context.sha,

                environment: "production",

                auto_merge: false,

                required_contexts: []
              });

            core.setOutput(
              "id",
              deployment.data.id.toString()
            );

      - uses: actions/github-script@v7
        with:
          script: |

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,

              deployment_id:
                Number(
                  "${{ steps.deploy.outputs.id }}"
                ),

              state: "success"
            })

  package:

    needs:
      - deploy
      - validate-version

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: |

          mkdir -p metadata

          cat > metadata/deployment.json <<EOF
          {
            "version": "${{ needs.validate-version.outputs.version }}",
            "deploymentId": "${{ needs.deploy.outputs.deployment_id }}",
            "runId": "${{ github.run_id }}",
            "sha": "${{ github.sha }}"
          }
          EOF

      - run: |

          nuget pack \
            packaging/ZenithOS.nuspec \
            -Version ${{ needs.validate-version.outputs.version }} \
            -OutputDirectory artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: zenith-package
          path: |
            artifacts/*.nupkg
            metadata/deployment.json

  release:

    needs:
      - package

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu-latest
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: binaries-windows-latest
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: binaries-macos-latest
          path: release/macos

      - uses: actions/download-artifact@v4
        with:
          name: zenith-package
          path: release/package

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZenithOS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/linux/*.zip
            release/windows/*.zip
            release/macos/*.zip
            release/package/*.nupkg
            release/package/deployment.json
