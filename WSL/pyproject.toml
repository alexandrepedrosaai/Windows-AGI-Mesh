[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "windows-agi-benchmark"
version = "1.0.0"
description = "Microsoft Exclusive — Windows AGI Benchmark Lab for heterogeneous AI inference"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Microsoft Corporation", email = "agi-bench@microsoft.com" }
]
keywords = [
    "benchmark", "inference", "llm", "agi", "rocm", "cuda", "onnx",
    "llama.cpp", "ollama", "vllm", "arm64", "riscv", "assembly",
    "windows", "wsl2", "docker", "azure", "microsoft"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "psutil>=5.9.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "qdrant-client>=1.8.0",
    "openai>=1.20.0",
    "langchain>=0.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "azure-ai-ml>=1.15.0",
    "azure-identity>=1.16.0",
    "azure-storage-blob>=12.19.0",
    "azure-monitor-opentelemetry>=1.3.0",
    "opentelemetry-sdk>=1.24.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "tensorrt>=10.0.0",
    "onnxruntime-gpu>=1.18.0",
    "nvidia-ml-py>=12.535.0",
]
rocm = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "onnxruntime-rocm>=1.18.0",
]
cpu = [
    "onnxruntime>=1.18.0",
    "torch>=2.3.0",
]
azure = [
    "azure-ai-ml>=1.15.0",
    "azure-identity>=1.16.0",
    "azure-storage-blob>=12.19.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-monitor-opentelemetry>=1.3.0",
    "msgraph-sdk>=1.3.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipython>=8.23.0",
    "jupyter>=1.0.0",
]
all = [
    "windows-agi-benchmark[cuda,rocm,azure,dev]"
]

[project.scripts]
agi-bench = "benchmark.runner:main"
agi-collect = "collectors.system_metrics:main"
agi-report = "benchmark.generate_html_report:main"
agi-deploy = "azure.azure_ml_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*", "collectors*", "agents*", "azure*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | build
  | dist
  | venv
  | .venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A",
    "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN",
    "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE",
    "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH",
    "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"
]
ignore = ["ANN101", "ANN102", "S101", "PLR0913", "TRY003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "amd: marks tests requiring AMD GPU",
    "nvidia: marks tests requiring NVIDIA GPU",
    "arm64: marks tests requiring ARM64",
    "riscv: marks tests requiring RISC-V",
    "azure: marks tests requiring Azure credentials",
]

[tool.coverage.run]
source = ["benchmark", "collectors", "agents"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]