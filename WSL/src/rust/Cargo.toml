[package]
name = "agi-bench-rs"
version = "1.0.0"
edition = "2021"
authors = ["Microsoft Corporation <agi-bench@microsoft.com>"]
description = "Windows AGI Benchmark Lab — Rust cross-architecture benchmark"
license = "LicenseRef-Microsoft-Exclusive"
repository = "https://github.com/microsoft/windows-agi-benchmark"
keywords = ["benchmark", "agi", "inference", "arm64", "riscv"]
categories = ["development-tools::profiling"]

[[bin]]
name = "agi-bench-rs"
path = "src/main.rs"

[[bench]]
name = "bench"
harness = false

[dependencies]
# Timing
instant = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Parallel processing
rayon = "1.10"

# Random number generation
rand = "0.8"
rand_xoshiro = "0.6"

# System info
sysinfo = "0.30"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Numeric
num-traits = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = []
simd = []
cuda = []
rocm = []
