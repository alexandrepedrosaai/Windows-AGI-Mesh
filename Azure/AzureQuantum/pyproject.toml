[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-agi-mesh-quantumsdk"
version = "2.0.0"
description = "5B-parameter LLM with hybrid quantum-classical quantization, Majorana QEC, MAIA-300, Brainwave FPGA, Hollow-Core Fiber"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Windows-AGI-Mesh Team", email = "agi-mesh@microsoft.com"}]
keywords = ["quantum", "llm", "ai", "azure", "majorana", "maia300", "fpga", "photonic"]
dependencies = []

[project.optional-dependencies]
azure = ["qdk[azure]>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
agi-mesh = "src.python.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
