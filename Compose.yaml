services:
  agi-mesh:
    container_name: windows-agi-mesh

    build:
      context: .
      dockerfile: Dockerfile

    image: windows-agi-mesh:local

    restart: unless-stopped
    init: true

    ports:
      - "8080:8080"

    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
