[workspace]
resolver = "2"
members = [
    "crates/zenith-abi",
    "crates/zenith-ipc",
    "crates/zenith-scheduler",
    "crates/zenith-runtime",
    "crates/zenith-migration",
    "crates/zenith-hypervisor",
    "crates/zenith-memory",
    "crates/zenith-ai-core",
]

[workspace.dependencies]
tokio       = { version = "1",   features = ["full"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
bincode     = "1"
thiserror   = "1"
uuid        = { version = "1",   features = ["v4", "serde"] }
tracing     = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
dashmap     = "5"
parking_lot = "0.12"
bytes       = "1"
rand        = "0.8"
sha2        = "0.10"
aes-gcm     = "0.10"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
futures     = "0.3"
crossbeam-channel = "0.5"
rayon       = "1"
criterion   = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
panic       = "abort"

[profile.dev]
opt-level   = 0
debug       = true
